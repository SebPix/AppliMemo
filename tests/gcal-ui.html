<!DOCTYPE html><meta charset="utf-8"><title>UI Google Agenda</title>
<!-- Lancer : python3 -m http.server 8123 puis ouvrir http://localhost:8123/tests/gcal-ui.html (résultats affichés sur la page) -->
<pre id="out">en cours…</pre>
<iframe id="f" src="../index.html" style="width:420px;height:800px"></iframe>
<script>
const out = []; let fails = 0;
const ok = (c, m) => { out.push((c ? 'ok   ' : 'FAIL ') + m); if (!c) fails++; };
const wait = ms => new Promise(r => setTimeout(r, ms));
(async () => {
  const f = document.getElementById('f');
  await new Promise(r => f.addEventListener('load', r)); await wait(300);
  const w = f.contentWindow, d = w.document, S = () => w.eval('state');
  const $ = s => d.querySelector(s), $$ = s => [...d.querySelectorAll(s)];
  const click = s => { const e = typeof s === 'string' ? $(s) : s; if (!e) throw new Error('introuvable: ' + s); e.click(); };
  const go = async h => { w.location.hash = h; await wait(150); };
  const submit = form => form.dispatchEvent(new w.Event('submit', { bubbles: true, cancelable: true }));
  window.onerror = m => ok(false, 'erreur JS: ' + m);
  try {
    // Préférences : carte Google Agenda, enregistrement de l'adresse Gmail et de l'identifiant
    await go('#/reglages');
    ok(!!$('#g-mail') && !!$('#g-client') && !!$('#g-connect') && !!$('#g-sync') && $('#g-status').textContent.includes('Non connecté') && w.eval('Gcal.configured()'), 'Préférences : carte Google Agenda (Gmail, connexion, synchro) ; identifiant par défaut déjà prêt');
    const set = (s, v) => { const e = $(s); e.value = v; e.dispatchEvent(new w.Event('change', { bubbles: true })); };
    set('#g-mail', 'pas un mail'); ok(w.eval('prefs.gmail') === '', 'Gmail invalide refusé');
    set('#g-mail', 'moi@gmail.com'); ok(w.eval('prefs.gmail') === 'moi@gmail.com', 'Gmail enregistré dans les préférences de l’appareil');
    set('#g-client', ' 123-abc.apps.googleusercontent.com '); ok(w.eval('prefs.gClient') === '123-abc.apps.googleusercontent.com' && $('#g-status').textContent.includes('Non connecté'), 'identifiant client enregistré (espaces retirés)');
    ok(JSON.parse(w.localStorage.getItem('applimemo.prefs')).gmail === 'moi@gmail.com', 'préférences persistées');
    ok($('#g-title').checked && w.eval('prefs.gTitleOnly') === true, 'option « Titre seulement » activée par défaut');
    $('#g-title').checked = false; $('#g-title').dispatchEvent(new w.Event('change', { bubbles: true })); ok(w.eval('prefs.gTitleOnly') === false, 'option « Titre seulement » désactivable');
    $('#g-title').checked = true; $('#g-title').dispatchEvent(new w.Event('change', { bubbles: true })); ok(w.eval('prefs.gTitleOnly') === true, 'option « Titre seulement » réactivable');
    w.eval("prefs.gClient = ''");   // retour à l'identifiant par défaut ; le test n'ouvre jamais la fenêtre Google (aucune session)

    // Journée : bouton Agenda → feuille → marque la journée
    const day = '2026-10-13'; await go('#/journee/' + day);
    w.eval(`day('${day}').blocs.push(touch({ id: 'b1', titre: 'Dentiste', texte: '', couleur: '#fff', horaire: '09:00', pos: 0 })); render()`); await wait(50);
    const agBtn = () => w.eval("topActions.find(a => a.label === 'Agenda')"); ok(!!agBtn(), 'journée : bouton 📆 Agenda (dans la lucarne)');
    agBtn().fn(); await wait(40);
    ok($('#sheet').textContent.includes('1 actuellement') && !!$('#sheet [data-link]'), 'journée : feuille Agenda (nombre de blocs horaires, copier le lien)');
    ok(!!$('#sheet #g-full') && !$('#sheet #g-full').checked, 'journée : case « Envoyer aussi le contenu » décochée par défaut');
    $('#sheet #g-full').checked = true; $('#sheet #g-full').dispatchEvent(new w.Event('change', { bubbles: true }));
    ok(w.eval('prefs.gTitleOnly') === false, 'cocher « contenu » désactive « Titre seulement »');
    w.eval('prefs.gTitleOnly = true');
    click('#sheet [data-on]'); await wait(60);
    ok(S().days[day].cal === true && agBtn().icon.includes('✓'), 'journée : marquée « dans l’agenda »');
    agBtn().fn(); await wait(40); click('#sheet [data-off]'); await wait(60);
    ok(!S().days[day].cal, 'journée : retirée de l’agenda');

    // Tâche : 📆 → date → t.cal
    await go('#/afaire'); click('[data-lvl=urgent]'); await wait(150);
    w.eval("levelNote('urgent').data.items.unshift({ id: 'i1', t: 'Payer', done: false, prio: 0, note: '' }); render()"); await wait(60);
    click('.todo [data-cal]'); await wait(40);
    const form = $('#sheet form'); form.elements.d.value = '2026-12-24'; form.elements.t.value = '18:30'; submit(form); await wait(80);
    const it = w.eval("levelNote('urgent').data.items.find(i => i.id === 'i1')");
    ok(it.cal === '2026-12-24' && it.calTime === '18:30' && $('.todo [data-cal]').classList.contains('on'), 'tâche : date + heure posées, 📆 allumé');
    click('.todo [data-cal]'); await wait(40); click('#sheet [data-clear]'); await wait(60);
    ok(!it.cal && !it.calTime, 'tâche : date retirée');

    // Mémo : action Agenda + lien d'ouverture
    const n = w.eval("newNote('divers', 'Mémo xxx')"); await go('#/note/' + n.id);
    const act = [...d.querySelectorAll('#top-actions button')].find(b => b.innerText.includes('Agenda'));
    ok(!!act, 'mémo : bouton Agenda dans le bandeau'); act.click(); await wait(40);
    const f2 = $('#sheet form'); f2.elements.d.value = '2026-10-13'; submit(f2); await wait(60);
    ok(S().notes.find(x => x.id === n.id).cal === '2026-10-13', 'mémo : date posée');
    const link = w.eval(`Gcal.linkNote('${n.id}')`);
    ok(link.includes('#/note/' + n.id), 'lien du mémo : ' + link);
    await go('#/menu'); w.location.hash = new URL(link).hash; await wait(150);   // le lien d'un événement Google ouvre bien le mémo
    ok($('#view-title').innerText.includes('Mémo xxx'), 'ouvrir le lien (#/note/<id>) ouvre le mémo dans l’app (nom dans la barre du haut)');
    ok(w.eval('Gcal.desired().has("n:' + n.id + '")'), 'l’événement du mémo est dans la liste à envoyer');
  } catch (e) { ok(false, 'exception: ' + e.message); }
  document.getElementById('out').textContent = out.join('\n') + '\n' + (fails ? fails + ' ÉCHEC(S)' : 'TOUS LES TESTS OK');
  document.title = 'DONE';
})();
</script>
