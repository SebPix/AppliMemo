<!DOCTYPE html><meta charset="utf-8"><title>UI indication du coffre</title>
<!-- Lancer : python3 -m http.server 8123 puis ouvrir http://localhost:8123/tests/vault-hint-ui.html (résultats affichés sur la page) -->
<pre id="out">en cours…</pre>
<iframe id="f" src="../index.html" style="width:420px;height:800px"></iframe>
<script>
const out = []; let fails = 0;
const ok = (c, m) => { out.push((c ? 'ok   ' : 'FAIL ') + m); if (!c) fails++; };
const wait = ms => new Promise(r => setTimeout(r, ms));
(async () => {
  const f = document.getElementById('f');
  await new Promise(r => f.addEventListener('load', r)); await wait(300);
  const w = f.contentWindow, d = w.document, S = () => w.eval('state');
  const $ = s => d.querySelector(s);
  const click = s => { const e = typeof s === 'string' ? $(s) : s; if (!e) throw new Error('introuvable: ' + s); e.click(); };
  const go = async h => { w.location.hash = h; await wait(150); };
  const submit = form => form.dispatchEvent(new w.Event('submit', { bubbles: true, cancelable: true }));
  const fill = vals => { const form = $('#sheet form'); for (const [k, v] of Object.entries(vals)) { const e = form.elements[k]; if (e.type === 'checkbox') e.checked = v; else e.value = v; } submit(form); };
  window.onerror = m => ok(false, 'erreur JS: ' + m);
  w.addEventListener('error', e => ok(false, 'erreur JS (appli): ' + e.message)); w.addEventListener('unhandledrejection', e => ok(false, 'promesse rejetée (appli): ' + (e.reason && e.reason.message || e.reason)));
  try {
    // création du coffre simulée (instantanée) : on teste l'indication, pas le chiffrement (voir tests/vault.test.js)
    w.Vault.create = async () => ({ vault: { salt: 'AAAA', iter: 100000, check: { iv: 'AAAA', ct: 'AAAA' }, updatedAt: Date.now() }, key: {} });
    await go('#/reglages');
    ok(d.body.innerText.includes('Créer le mot de passe du coffre'), 'Préférences : pas encore de coffre');
    click('#p-vset'); await wait(40);
    ok(!!$('#sheet [name=h]') && $('#sheet').innerText.includes('lisible sans déverrouiller'), 'création : champ « indication » avec avertissement');
    fill({ a: 'MotDePasse-Solide1', b: 'MotDePasse-Solide1', h: '', ok: true }); await wait(80);
    ok(!S().vault && !$('#sheet').hidden, 'création : indication vide refusée');
    fill({ a: 'MotDePasse-Solide1', b: 'MotDePasse-Solide1', h: 'ici : motdepasse-solide1 !', ok: true }); await wait(80);
    ok(!S().vault, 'création : indication contenant le mot de passe refusée (sans tenir compte des majuscules)');
    fill({ a: 'MotDePasse-Solide1', b: 'MotDePasse-Solide1', h: '  prénom du chat + année  ', ok: true }); await wait(150);
    ok(!!S().vault && S().vault.hint === 'prénom du chat + année', 'création : indication enregistrée (espaces retirés)');
    // elle est lisible coffre verrouillé, mais cachée jusqu'au clic sur « Indice »
    w.eval("lockVault(true)"); const n = w.eval("newNote('password', 'Perso')"); await go('#/note/' + n.id); await wait(100);
    ok(!!$('#v-hint') && $('#v-hint-t').hidden, 'coffre verrouillé : bouton « Indice », texte caché au départ');
    click('#v-hint'); ok(!$('#v-hint-t').hidden && $('#v-hint-t').textContent === 'prénom du chat + année', 'bouton « Indice » : affiche l’indication');
    click('#v-hint'); ok($('#v-hint-t').hidden, 'bouton « Indice » : la cache de nouveau');
    ok(!w.localStorage.getItem('applimemo.v1') || !w.localStorage.getItem('applimemo.v1').includes('MotDePasse-Solide1'), 'le mot de passe n’est jamais stocké');
    // modifier l'indication sans changer le mot de passe
    await go('#/reglages'); const salt = S().vault.salt;
    click('#p-vhint'); await wait(40);
    fill({ h: '' }); await wait(40); ok(S().vault.hint === 'prénom du chat + année', 'modification : indication vide refusée');
    fill({ h: 'le chat de Mamie' }); await wait(60);
    ok(S().vault.hint === 'le chat de Mamie' && S().vault.salt === salt, 'modification : indication changée, mot de passe et chiffrement intacts');
    ok(w.eval("Core.migrate(JSON.parse(JSON.stringify(state)), '2026-01-01').vault.hint") === 'le chat de Mamie', 'l’indication survit à l’export / import');
    // l'agenda Google n'envoie jamais le coffre ni son indication
    w.eval("state.notes.find(x => x.id === '" + n.id + "').cal = '2026-10-13'");
    const desc = w.eval("Gcal.desired().get('n:" + n.id + "').description");
    ok(!desc.includes('Mamie') && !desc.includes('chat'), 'Google Agenda : jamais d’indication ni de contenu du coffre');
  } catch (e) { ok(false, 'exception: ' + e.message); }
  document.getElementById('out').textContent = out.join('\n') + '\n' + (fails ? fails + ' ÉCHEC(S)' : 'TOUS LES TESTS OK');
  document.title = 'DONE';
})();
</script>
