<!DOCTYPE html><meta charset="utf-8"><title>UI tests</title>
<!-- Lancer : python3 -m http.server 8123 puis ouvrir http://localhost:8123/tests/ui.html (résultats affichés sur la page) -->
<pre id="out">en cours…</pre>
<iframe id="f" src="../index.html" style="width:420px;height:800px"></iframe>
<script>
const out = []; let fails = 0;
const ok = (c, m) => { out.push((c ? 'ok   ' : 'FAIL ') + m); if (!c) fails++; };
const wait = ms => new Promise(r => setTimeout(r, ms));
(async () => {
  const f = document.getElementById('f');
  await new Promise(r => f.addEventListener('load', r)); await wait(300);
  const w = f.contentWindow, d = w.document, S = () => w.eval('state');
  const $ = s => d.querySelector(s), $$ = s => [...d.querySelectorAll(s)];
  const click = s => { const e = typeof s === 'string' ? $(s) : s; if (!e) throw new Error('introuvable: ' + s); e.click(); };
  const type = (s, v) => { const e = $(s); e.value = v; e.dispatchEvent(new w.Event('input', { bubbles: true })); e.dispatchEvent(new w.Event('change', { bubbles: true })); };
  const submit = form => form.dispatchEvent(new w.Event('submit', { bubbles: true, cancelable: true }));
  const fill = (vals) => { const form = $('#sheet form'); for (const [k, v] of Object.entries(vals)) { const e = form.elements[k]; if (e.type === 'checkbox') e.checked = v; else e.value = v; } submit(form); };
  const go = async h => { w.location.hash = h; await wait(120); };
  const txt = () => d.body.innerText;
  const TODAY = w.eval('todayISO()');
  const topBtn0 = l => [...d.querySelectorAll('#top-actions button')].find(b => b.innerText.includes(l));
  window.onerror = (m) => ok(false, 'erreur JS: ' + m);
  w.print = () => { w.__printed = true; };
  try {
    // --- Démarrage
    const tabs = $$('#tabbar button').map(b => b.dataset.view);
    ok(tabs.join() === 'journee,afaire,checklists,memos,biblio', 'barre du bas : Journée, À faire, Check-listes, Mémos, Bibliothèque (dans cet ordre)');
    ok($('#btn-gear').textContent.includes('⚙'), 'roue crantée présente');
    ok(!txt().includes('Thèmes') || true, '');

    // --- Journée : écran d'ouverture à 3 choix
    ok(w.location.hash === '#/journee' && $$('#app [data-c], #app .bigcard').length === 3, 'journée : à l\'ouverture, 3 choix');
    const choose = $('#app .choose').innerText;
    ok(choose.includes('Aujourd’hui') && choose.includes('Date à définir') && choose.includes('Journée type'), 'choix : Aujourd\'hui · Date à définir · Journée type');
    ok($('#jt-sel').disabled && !$('#top-actions').offsetParent, 'journée type : menu vide désactivé ; pas de barre d\'actions sur l\'écran de choix');
    click('[data-c=date]'); await wait(30);
    { const f2 = $('#sheet form'); f2.elements.d.value = '2026-03-14'; submit(f2); } await wait(80);
    ok(w.location.hash === '#/journee/2026-03-14' && $('.day-title').innerText.toLowerCase().includes('14 mars 2026') && !$('.date-label'), 'Date à définir : ouvre la journée choisie (titre = date)');
    await go('#/journee'); click('[data-c=today]'); await wait(80);
    ok(w.location.hash === '#/journee/' + TODAY && $('.day-title').innerText === 'Aujourd’hui', 'Aujourd\'hui : ouvre la journée du jour, titre « Aujourd’hui »');
    ok($('.date-label').innerText.toLowerCase() === w.eval('longDate(todayISO())'), 'Aujourd\'hui : la date du jour en petit sous le titre');
    ok(!$('#date-input') && !$('#subtitle') && !$('input[type=date]'), 'ni calendrier ni champ « nom » dans l\'en-tête');
    ok($$('.day-head .actions button').map(b => b.innerText.replace(/[^\p{L}+]/gu, '').trim()).join('|') === 'Vider|Trier|Bloc', 'boutons : uniquement Vider, Trier, + Bloc');
    const tc = getComputedStyle($('.day-title')).color, bandc = getComputedStyle($('.day-head')).borderLeftColor;
    const rgbOf = c => (c.startsWith('color(') ? c.match(/[\d.]+/g).slice(-3).map(v => v * 255) : c.match(/\d+/g).map(Number));
    const near = (a, b) => { const x = rgbOf(a), y = rgbOf(b); return Math.abs(x[0] - y[0]) < 40 && Math.abs(x[1] - y[1]) < 40 && Math.abs(x[2] - y[2]) < 40; };
    ok(near(tc, 'rgb(149, 165, 166)') && bandc === 'rgb(149, 165, 166)', 'titre « Aujourd’hui » gris, comme la barre latérale (1 semaine)');

    // --- Journée : bloc + hashtag
    click('#b-add'); await wait(50);
    type('.bloc input.titre', 'Réunion équipe');
    ok(!$('.bloc textarea') && $('.bloc [data-act=toggle]').innerText.includes('▼'), 'bloc : rétracté par défaut (pas de zone de texte)');
    click('.bloc [data-act=toggle]'); await wait(30);
    ok(!!$('.bloc textarea'), 'bloc : la flèche le déroule');
    type('.bloc textarea', 'Préparer le point #Projet-Alpha avec Marc');
    click('.bloc [data-act=toggle]'); await wait(30);
    ok(!$('.bloc textarea'), 'bloc : se rétracte de nouveau');
    ok(S().days[S().current].blocs.length === 1 && S().days[S().current].blocs[0].texte.includes('#Projet-Alpha'), 'journée : bloc créé et texte enregistré');
    const bar = $('#top-actions').innerText;
    ok(['Sauvegarder', 'Versions', 'Journées types', 'Définir comme type', 'PDF', 'Archive'].every(x => bar.includes(x)), 'journée : barre du haut sur le modèle de À faire (+ Archive)');
    ok(S().days[TODAY].keep === 'week', 'journée du jour : grise (1 semaine) par défaut');
    ok(!$('#top-actions').innerText.includes('Listes types'), 'journée : « Journées types » (pas « Listes types »)');

    // --- À faire : ligne de détail + barre d'actions du bandeau
    await go('#/afaire');
    ok(!$('#top-actions').hidden && ['Sauvegarder', 'Versions', 'Listes types', 'Définir comme type', 'PDF'].every(x => $('#top-actions').innerText.includes(x)), 'À faire : barre d\'actions dans le bandeau');
    for (const t of ['Appeler Paul', 'Acheter du pain']) { type('#todo-new', t); submit($('#todo-form')); }
    ok(S().todos.length === 2, 'À faire : 2 tâches');
    click('.todo [data-arrow]'); await wait(50);
    ok(!!$('.todo-note'), 'À faire : la flèche déploie la zone de texte');
    type('.todo-note', 'Demander le devis\nRappeler jeudi #Chantier');
    ok(S().todos.some(t => t.note.includes('devis')), 'À faire : détail enregistré');
    click('.todo [data-arrow]'); await wait(50); ok(!$('.todo-note') && txt().includes('Demander'), 'À faire : repliable, aperçu de la 1re ligne');
    const act = l => click($$('#top-actions button').find(b => b.innerText.includes(l)));
    const todoOrder = () => S().todos.filter(t => !t.deletedAt).map(t => t.text).sort().join('|');
    act('Sauvegarder'); fill0 = () => { const f2 = $('#sheet form'); f2.elements.v.value = 'V1'; submit(f2); }; fill0(); await wait(50);
    ok(S().lists.some(l => l.kind === 'version' && l.scope === 'todo' && l.name === 'V1' && l.items.length === 2 && l.keep === 'week'), 'À faire : version sauvegardée, grise par défaut');
    type('#todo-new', 'Tâche en trop'); submit($('#todo-form')); ok(S().todos.filter(t => !t.deletedAt).length === 3, 'À faire : 3 tâches avant restauration');
    act('Versions'); await wait(30); click('#sheet [data-load]'); await wait(80);
    ok(S().todos.filter(t => !t.deletedAt).length === 2 && todoOrder() === 'Acheter du pain|Appeler Paul', 'À faire : ancienne version rechargée');
    ok(S().todos.some(t => !t.deletedAt && t.note.includes('devis')), 'À faire : détails conservés dans la version');
    act('Définir comme type'); { const f2 = $('#sheet form'); f2.elements.v.value = 'Ma liste type'; submit(f2); } await wait(50);
    ok(S().lists.some(l => l.kind === 'template' && l.name === 'Ma liste type' && l.keep === 'never'), 'À faire : liste type (modèle) en illimité');
    S().todos.forEach(t => {}); w.eval("live(state.todos).forEach(kill); VIEWS.afaire($('#app'))"); await wait(30);
    ok(txt().includes('Rien à faire'), 'À faire : vidée');
    act('Listes types'); await wait(30); click('#sheet [data-load]'); await wait(80);
    ok(S().todos.filter(t => !t.deletedAt).length === 2, 'À faire : liste type sélectionnée');

    // --- Mémos : accueil et création de chaque type
    await go('#/memos');
    ok($$('.tile').length === 7 && !$('#app').innerText.includes('Check-listes'), 'mémos : 7 tuiles, sans les check-listes');
    const mk = async (type, name) => { await go('#/memos'); click('#m-new'); click(`[data-t=${type}]`); const f2 = $('#sheet form'); f2.elements.v.value = name; submit(f2); await wait(120); };
    await go('#/checklists'); click('#cl-new'); { const f2 = $('#sheet form'); f2.elements.v.value = 'Valise'; submit(f2); } await wait(120);
    ok(w.location.hash.startsWith('#/note/') && $('#view-title').textContent === 'CHECK-LISTES', 'check-liste créée ; titre du bandeau « CHECK-LISTES »');
    ok(!$('#top-actions').hidden && ['Dupliquer', 'PDF', 'Supprimer', 'Sauvegarder', 'Versions', 'Listes types', 'Définir comme type'].every(x => $('#top-actions').innerText.includes(x)), 'check-liste : Dupliquer/PDF/Supprimer + actions À faire dans le bandeau');
    ok(!$('[data-na=dup]'), 'check-liste : plus de boutons dans la page');
    ok($('#tabbar .on').dataset.view === 'checklists', 'onglet Check-listes actif sur une check-liste');
    const CL = () => S().notes.find(n => n.title === 'Valise');
    for (const t of ['Passeport', 'Chargeur', 'Maillot un très très long texte qui ne rentre sûrement pas dans une colonne étroite du tout']) { type('#c-new', t); submit($('#c-form')); }
    ok(CL().data.items.length === 3, 'check-liste : 3 lignes');
    const cs = getComputedStyle($('.cl-grid'));
    ok(cs.gridTemplateRows.split(' ').length === 20, 'check-liste : 20 lignes par colonne minimum');
    ok(CL().data.cols === 2 || !CL().data.cols, 'check-liste : 2 colonnes par défaut');
    ok(getComputedStyle($('.cl-grid')).gridTemplateColumns.split(' ').length === 2, 'check-liste : rendu en 2 colonnes');
    ok($('.cl-row').offsetHeight <= 30 && parseFloat(getComputedStyle($('.cl-row')).fontSize) <= 13, 'check-liste : lignes réduites (≤ 30 px, police 13 px)');
    click('[data-cols="3"]'); await wait(30); ok(getComputedStyle($('.cl-grid')).gridTemplateColumns.split(' ').length === 3 && CL().data.cols === 3, 'bouton colonnes : 3');
    click('[data-cols="1"]'); await wait(30); ok(getComputedStyle($('.cl-grid')).gridTemplateColumns.split(' ').length === 1, 'bouton colonnes : 1');
    click('[data-cols="2"]'); await wait(30);
    for (let i = 0; i < 25; i++) { type('#c-new', 'Ligne ' + i); submit($('#c-form')); }
    ok(getComputedStyle($('.cl-grid')).gridTemplateRows.split(' ').length === 20 && CL().data.items.length === 28, 'check-liste : 28 lignes en 2 colonnes (20 + 8)');
    ok($('.cl-t').scrollWidth > 0, '');
    const longRow = $$('.cl-row').find(r => r.innerText.includes('Maillot'));
    ok(longRow.querySelector('.cl-t').scrollWidth > longRow.querySelector('.cl-t').clientWidth, 'ligne longue : texte tronqué');
    longRow.querySelector('.cl-t').click(); await wait(30);
    ok(!$('#pop').hidden && $('.pop-text').innerText.includes('très très long texte'), 'clic sur la ligne : fenêtre centrale avec le texte complet');
    ok(getComputedStyle($('#pop')).backdropFilter.includes('blur') || getComputedStyle($('#pop')).webkitBackdropFilter?.includes('blur'), 'fond flou derrière la fenêtre');
    ok(!$('#pop input[type=checkbox]'), 'fenêtre ouverte : pas de case à cocher (cochable seulement réduite)');
    $('.pop-text').click(); await wait(20); ok($('#pop').hidden, 'reclic sur la fenêtre : elle se ferme');
    longRow.querySelector('.cl-t').click(); await wait(20); click('#pop [data-e]'); $('#pop textarea').value = 'Maillot court'; click('#pop [data-ok]'); await wait(30);
    ok(CL().data.items[2].t === 'Maillot court' && $('#pop').hidden, 'modification d\'une ligne depuis la fenêtre');
    $$('.cl-row input[type=checkbox]')[0].click(); await wait(30);
    ok(CL().data.items[0].done === true && txt().includes('1/28'), 'case cochée en mode réduit');
    click('#c-reset'); ok(CL().data.items.every(i => !i.done), 'check-liste : tout décocher');
    // Versions / listes types sur check-liste
    const act2 = l => click($$('#top-actions button').find(b => b.innerText.includes(l)));
    act2('Sauvegarder'); { const f2 = $('#sheet form'); f2.elements.v.value = 'Avant'; submit(f2); } await wait(30);
    ok(S().lists.some(l => l.scope === 'checklist' && l.kind === 'version' && l.ref === CL().id), 'check-liste : version sauvegardée (liée à la liste)');
    act2('Définir comme type'); { const f2 = $('#sheet form'); f2.elements.v.value = 'Type Voyage'; submit(f2); } await wait(30);
    ok(S().lists.some(l => l.scope === 'checklist' && l.kind === 'template'), 'check-liste : définie comme liste type');
    act2('Dupliquer'); await wait(150);
    ok(S().notes.some(n => n.title === 'Valise (copie)' && n.data.items.length === 28 && n.data.items[0].id !== CL().data.items[0].id), 'check-liste dupliquée depuis le bandeau');
    await go('#/checklists'); click('#cl-tpl'); await wait(30); click('#sheet [data-id]'); await wait(120);
    ok(S().notes.some(n => n.title === 'Type Voyage' && n.data.items.length === 28), 'nouvelle check-liste depuis une liste type');
    await go('#/checklists'); ok($$('a.lrow').length === 3, 'liste des check-listes');

    await mk('divers', 'Vélo');
    ok(S().notes.at(-1).title === 'Mémo Vélo', 'mémo divers nommé « Mémo Vélo »');
    type('#d-text', 'Changer les pneus #Sport et graisser la chaîne'); await wait(600);
    ok($('#n-tags').innerText.includes('#Sport'), 'note : le # est détecté et affiché');

    await mk('links', 'Favoris'); click('#i-add'); fill({ titre: 'Anthropic', url: 'anthropic.com', cat: 'Tech', note: '' }); await wait(50);
    const it = S().notes.at(-1).data.items[0];
    ok(it && it.url === 'https://anthropic.com/' && it.cat === 'Tech', 'lien ajouté (https:// ajouté, catégorie)');
    click('#i-add'); fill({ titre: 'x', url: 'javascript:alert(1)', cat: '', note: '' }); await wait(30);
    ok(S().notes.at(-1).data.items.length === 1, 'lien javascript: refusé');
    ok($('a[href="https://anthropic.com/"]')?.rel.includes('noopener'), 'lien externe avec noopener');

    await mk('emails', 'Contacts'); click('#i-add'); fill({ nom: 'Marc', email: 'marc@ex.fr', cat: 'Pro', note: '' });
    ok(S().notes.at(-1).data.items[0].email === 'marc@ex.fr' && $('a[href="mailto:marc@ex.fr"]'), 'mail ajouté + lien mailto');

    await mk('places', 'Adresses'); click('#i-add'); fill({ nom: 'Chez Paul', adresse: '12 rue des Lilas, Lyon', cat: 'Restaurants', note: '' });
    ok(txt().toLowerCase().includes('restaurants') && txt().includes('Chez Paul'), 'lieu ajouté, classé par catégorie');

    await mk('birthdays', 'Famille'); const t = new Date(); click('#i-add');
    fill({ nom: 'Léa', j: t.getDate(), m: t.getMonth() + 1, a: 1990, note: '' }); await wait(50);
    ok(txt().includes("aujourd'hui"), 'anniversaire du jour affiché');
    await go('#/journee/' + TODAY); ok($('.bday-banner')?.innerText.includes('Léa'), 'bandeau anniversaire sur la Journée');

    await mk('photos', 'Favoris photos'); click('#i-add'); fill({ url: 'vacances/plage.jpg', titre: 'Plage', album: 'Été' }); await wait(50);
    ok(txt().includes('Adresse Bunny manquante'), 'photo relative sans Bunny : message');
    w.eval("prefs.bunny='https://ma-zone.b-cdn.net'"); w.eval('render()'); await wait(80);
    ok($('.ph img')?.src === 'https://ma-zone.b-cdn.net/vacances/plage.jpg', 'photo : URL Bunny reconstituée');

    // --- Coffre
    await mk('password', 'Perso'); ok(txt().includes('Créer mon mot de passe du coffre'), 'coffre : invite à créer le mot de passe');
    click('#v-setup'); fill({ a: 'court', b: 'court', ok: true }); await wait(50);
    ok(!S().vault, 'coffre : mot de passe trop court refusé');
    fill({ a: 'MotDePasse-Solide1', b: 'MotDePasse-Solide1', ok: true }); await wait(800);
    ok(!!S().vault && txt().includes('Ajouter'), 'coffre créé et déverrouillé');
    click('#p-add'); fill({ site: 'banque.fr', login: 'jean', pwd: 'S3cret-ÉÉ!', note: '' }); await wait(500);
    const pn = S().notes.at(-1);
    ok(pn.data.enc && pn.data.kid === S().vault.salt, 'coffre : entrée chiffrée enregistrée');
    w.eval('flush()'); const raw = w.localStorage.getItem('applimemo.v1');
    ok(!raw.includes('banque.fr') && !raw.includes('S3cret') && !raw.includes('jean'), 'coffre : rien en clair dans le stockage');
    click('#p-lock'); await wait(100); ok(txt().includes('Coffre verrouillé'), 'coffre : verrouillage');
    $('#v-pw').value = 'faux'; submit($('#v-form')); await wait(800); ok(txt().includes('Coffre verrouillé'), 'coffre : mauvais mot de passe refusé');
    $('#v-pw').value = 'MotDePasse-Solide1'; submit($('#v-form')); await wait(800);
    ok(txt().includes('banque.fr') && txt().includes('jean'), 'coffre : déverrouillé, entrée relue');

    // --- Bibliothèque
    await go('#/biblio');
    const tree = txt();
    ok(['Journées', 'À faire', 'Mémos', 'Thèmes', 'Check-listes', 'Mots de passe', 'Photos favorites'].every(x => tree.includes(x)), 'bibliothèque : arborescence complète');
    const order = $$('#lib-body > details > summary').map(x => x.innerText.split('\n')[0].trim());
    ok(order.join('|').replace(/[^\p{L}|-]/gu, '') === 'Journées|Àfaire|Check-listes|Mémos|Thèmes'.replace(/[^\p{L}|-]/gu, ''), 'bibliothèque : ordre Journées, À faire, Check-listes, Mémos, Thèmes (' + order.join('|') + ')');
    const fs = sel => parseFloat(getComputedStyle($(sel)).fontSize);
    const M = '#lib-body details[data-k=memos]'; const l1 = fs(M + ' > summary'), l2 = fs(M + ' details > summary'), l3 = fs(M + ' details > .lrow');
    const ind = sel => $(sel).getBoundingClientRect().left;
    ok(l1 > l2 && l2 > l3, `bibliothèque : taille dégressive (${l1}px > ${l2}px > ${l3}px)`);
    ok(ind(M + ' > summary') < ind(M + ' details > summary') && ind(M + ' details > summary') < ind(M + ' details > .lrow'), 'bibliothèque : retrait progressif');
    ok($('a.chip[href*="/tag/projet-alpha"]') && $('a.chip[href*="/tag/sport"]'), 'bibliothèque : thèmes #Projet-Alpha (journée) et #Sport (mémo) détectés');
    type('#lib-q', '#proj'); await wait(300);
    ok(txt().includes('Réunion équipe') || txt().includes('Projet-Alpha'), 'recherche #proj : trouve la journée');
    type('#lib-q', 'pneus'); await wait(300); ok(txt().includes('Mémo Vélo'), 'recherche plein texte « pneus » : trouve le mémo');
    type('#lib-q', 'banque'); await wait(300); ok(txt().includes('0 résultat'), 'recherche : le contenu du coffre n’est pas indexé');
    type('#lib-q', '#sport pneus'); await wait(300); ok(txt().includes('1 résultat'), 'recherche combinée #tag + mot');
    type('#lib-q', ''); await wait(300);
    await go('#/tag/sport'); ok(txt().includes('Mémo Vélo') && txt().includes('#SPORT'), 'page thème #sport');

    // --- Sélection + PDF + JSON
    await go('#/biblio'); click('#lib-sel'); await wait(50);
    ok($$('[data-sel]').length >= 5, 'mode sélection : cases à cocher');
    $$('[data-sel]').forEach(c => { c.checked = true; c.dispatchEvent(new w.Event('change')); });
    ok(w.eval('libSel.size') >= 5, 'sélection multiple');
    click('#sel-bar [data-x=pdf]'); await wait(300);
    const pr = d.querySelector('#print-root').innerHTML;
    ok(pr.includes('Valise') && pr.includes('Mémo Vélo') && pr.includes('Chez Paul') && pr.includes('Réunion équipe'), 'PDF : pages sélectionnées composées');
    ok(!pr.includes('banque.fr') && !pr.includes('Perso</h2>'), 'PDF : coffre exclu');
    ok(w.__printed === true, 'PDF : impression déclenchée');
    const sub = w.eval("JSON.stringify(subsetState([...libSel]))");
    ok(JSON.parse(sub).notes.length >= 6 && !sub.includes('S3cret'), 'JSON sélection : sous-ensemble sans clair');

    // --- Journée : sauvegarde (durée demandée), versions, journée type
    await go('#/journee/' + TODAY);
    click(topBtn0('Sauvegarder')); await wait(30);
    ok($$('#sheet input[type=radio]').length === 4 && $('#sheet input[type=radio]:checked').value === 'week', 'sauvegarde : la durée est demandée, grise (1 semaine) cochée par défaut');
    { const f2 = $('#sheet form'); f2.elements.v.value = 'Journée V1'; f2.elements.k.value = 'year'; submit(f2); } await wait(100);
    ok(S().lists.some(l => l.scope === 'day' && l.kind === 'version' && l.name === 'Journée V1' && l.keep === 'year' && l.ref === TODAY && l.items.length === 1 && l.items[0].titre === 'Réunion équipe'), 'journée sauvegardée : version orange (1 année), contenu des blocs');
    ok(S().days[TODAY].keep === 'year' && getComputedStyle($('.day-head')).borderLeftColor === 'rgb(230, 126, 34)', 'journée sauvegardée : la journée prend la durée choisie (bandeau orange)');
    click(topBtn0('Définir comme type')); { const f2 = $('#sheet form'); f2.elements.v.value = 'Journée réunion'; submit(f2); } await wait(50);
    ok(S().lists.some(l => l.scope === 'day' && l.kind === 'template' && l.name === 'Journée réunion' && l.keep === 'never' && l.items.length === 1), 'journée type définie (modèle en illimité)');
    w.eval("live(day().blocs).forEach(kill); render()"); await wait(60);
    ok(txt().includes('Aucun bloc'), 'journée vidée');
    click(topBtn0('Versions')); await wait(30); ok($('#sheet').innerText.includes('Journée V1') && $('#sheet').innerText.includes('1 bloc'), 'versions de la journée listées');
    click('#sheet [data-load]'); await wait(80);
    ok(txt().includes('Réunion équipe') || $('.bloc input.titre')?.value === 'Réunion équipe', 'ancienne version de la journée rechargée');
    await go('#/journee'); await wait(30);
    ok(!$('#jt-sel').disabled && $$('#jt-sel option').length === 2 && $('#jt-sel').innerText.includes('Journée réunion'), 'écran de choix : menu déroulant des journées types existantes');
    ok($('#jt-more').hidden, 'date de création masquée tant qu\'aucun modèle choisi');
    $('#jt-sel').value = $('#jt-sel option:nth-child(2)').value; $('#jt-sel').dispatchEvent(new w.Event('change')); await wait(20);
    ok(!$('#jt-more').hidden, 'modèle choisi : date + bouton Créer');
    $('#jt-date').value = '2027-01-05'; click('#jt-go'); await wait(100);
    ok(w.location.hash === '#/journee/2027-01-05' && S().days['2027-01-05'].blocs.filter(b => !b.deletedAt).length === 1 && S().days['2027-01-05'].blocs[0].titre === 'Réunion équipe' && S().days['2027-01-05'].keep === 'week', 'journée type appliquée à la date choisie ; nouvelle journée grise');
    await go('#/journee'); ok($('.resume'), 'lien « Reprendre » vers la dernière journée');
    await go('#/journee/' + TODAY);

    // --- Archivage par élément : code couleur + réglage dans le bandeau du haut
    const RGB = { never: 'rgb(214, 48, 49)', year: 'rgb(230, 126, 34)', month: 'rgb(43, 140, 189)', week: 'rgb(149, 165, 166)' };
    const bc = sel => getComputedStyle($(sel)).borderLeftColor, bw = sel => parseFloat(getComputedStyle($(sel)).borderLeftWidth);
    const topBtn = l => $$('#top-actions button').find(b => b.innerText.includes(l));
    const pickKeep = async k => { click('#sheet [data-k=' + k + ']'); await wait(60); };
    await go('#/journee/' + TODAY);
    w.eval("setKeep(day(), 'week'); render()"); await wait(40);   // retour à la valeur par défaut (la sauvegarde ci-dessus l'avait passée à 1 année)
    ok(bc('.day-head') === RGB.week && bw('.day-head') >= 6, 'journée : bandeau vertical gris par défaut');
    ok(topBtn('Archive : 1 semaine'), 'journée : bouton « Archive » dans le bandeau du haut');
    click(topBtn('Archive')); await wait(30);
    ok($$('#sheet [data-k]').map(b => b.dataset.k).join() === 'never,year,month,week' && ['Illimitée', '1 année', '1 mois', '1 semaine'].every(x => $('#sheet').innerText.includes(x)), 'fenêtre : 4 durées (illimitée, année, mois, semaine)');
    await pickKeep('month');
    ok(S().days[S().current].keep === 'month' && bc('.day-head') === RGB.month && topBtn('Archive : 1 mois') && txt().includes('Effacé le'), 'journée : 1 mois → bleu, date d\'effacement affichée');
    const note = S().notes.find(n => n.title === 'Mémo Vélo');
    await go('#/note/' + note.id);
    ok(bc('.note-head') === RGB.never && topBtn('Archive : Illimitée'), 'note : rouge par défaut + bouton dans le bandeau');
    for (const k of ['year', 'month', 'week', 'never']) { click(topBtn('Archive')); await pickKeep(k); ok(S().notes.find(n => n.id === note.id).keep === k && bc('.note-head') === RGB[k], `note : ${k} → bandeau ${k === 'never' ? 'rouge' : k === 'year' ? 'orange' : k === 'month' ? 'bleu' : 'gris'}`); }
    await go('#/note/' + S().notes.find(n => n.title === 'Valise').id);
    ok(topBtn('Archive') && topBtn('Dupliquer') && topBtn('Sauvegarder'), 'check-liste : Archive avec les autres actions du bandeau');
    await go('#/afaire');
    ok($$('.todo').every(t => getComputedStyle(t).borderLeftColor === RGB.never) && topBtn('Archive : toutes'), 'À faire : bandeau rouge sur chaque tâche + action globale');
    $('.todo').click(); await wait(40);
    ok(S().todos.filter(t => !t.deletedAt).some(t => t.keep === 'year') && getComputedStyle($('.todo')).borderLeftColor === RGB.year, 'À faire : toucher le bandeau d\'une tâche change sa durée (rouge → orange)');
    click(topBtn('Archive : toutes')); await pickKeep('month');
    ok(S().todos.filter(t => !t.deletedAt).every(t => t.keep === 'month') && $$('.todo').every(t => getComputedStyle(t).borderLeftColor === RGB.month), 'À faire : « toutes » applique 1 mois (bleu) à toutes les tâches');
    await go('#/memos'); ok($$('a.lrow.kc').length > 0 && $$('a.lrow.kc').every(a => Object.values(RGB).includes(getComputedStyle(a).borderLeftColor)), 'liste des mémos : bandeaux colorés');
    w.eval('libSelect = false; libSel.clear()'); await go('#/biblio'); ok($$('#lib-body a.lrow.kc').length >= 3 && $$('#lib-body a.lrow.kc').every(a => Object.values(RGB).includes(getComputedStyle(a).borderLeftColor)), 'bibliothèque : bandeaux colorés sur les lignes');

    // --- Effacement selon la durée (à la dernière modification)
    const D = 864e5, ago = n => `Date.now() - ${n} * ${D}`;
    w.eval(`(() => {
      const mk = (id, type, keep, age) => state.notes.push({ id, type, title: id, fav: false, keep, updatedAt: ${ago('age')}, data: defaultData(type) });
      mk('n-year-400', 'divers', 'year', 400); mk('n-year-100', 'divers', 'year', 100); mk('n-week-10', 'divers', 'week', 10); mk('n-week-3', 'divers', 'week', 3);
      mk('n-never-900', 'divers', 'never', 900); mk('n-month-40', 'divers', 'month', 40);
      state.todos.push({ id: 't-week-10', text: 'vieille tâche', note: 'x', done: false, prio: 0, keep: 'week', updatedAt: ${ago(10)} });
      state.lists.push({ id: 'l-week-10', scope: 'todo', kind: 'version', ref: '', name: 'vieille version', keep: 'week', items: [{ t: 'a', done: false, prio: 0, note: '' }], updatedAt: ${ago(10)} });
      state.days['2020-01-02'] = { date: '2020-01-02', subtitle: 'vieux jour', updatedAt: ${ago(40)}, keep: 'month', blocs: [{ id: 'b-old', titre: 'x', texte: 'y', couleur: '#ffffff', horaire: null, pos: 0, updatedAt: ${ago(40)} }] };
      state.days['2020-01-03'] = { date: '2020-01-03', subtitle: 'jour récent', updatedAt: ${ago(40)}, keep: 'month', blocs: [{ id: 'b-new', titre: 'x', texte: 'y', couleur: '#ffffff', horaire: null, pos: 0, updatedAt: ${ago(5)} }] };
    })()`);
    const alive = id => S().notes.some(n => n.id === id && !n.deletedAt);
    const n = w.eval('purgeExpired()'); await wait(30);
    ok(n === 6, `purge : 6 éléments expirés effacés (obtenu ${n})`);
    ok(!alive('n-year-400') && alive('n-year-100'), 'purge : 1 année → effacé à 400 j, conservé à 100 j');
    ok(!alive('n-week-10') && alive('n-week-3'), 'purge : 1 semaine → effacé à 10 j, conservé à 3 j');
    ok(alive('n-never-900'), 'purge : illimitée → jamais effacée (900 j)');
    ok(alive('n-month-40') === false, 'purge : 1 mois → effacé à 40 j');
    ok(S().todos.find(t => t.id === 't-week-10').deletedAt && S().todos.find(t => t.id === 't-week-10').text === '', 'purge : tâche expirée effacée, contenu vidé');
    ok(S().lists.find(l => l.id === 'l-week-10').deletedAt, 'purge : version expirée effacée');
    ok(S().days['2020-01-02'].subtitle === '' && S().days['2020-01-02'].blocs[0].deletedAt && S().days['2020-01-02'].blocs[0].texte === '', 'purge : journée expirée vidée');
    ok(S().days['2020-01-03'].subtitle === 'jour récent' && !S().days['2020-01-03'].blocs[0].deletedAt, 'purge : journée modifiée récemment (bloc à 5 j) conservée');
    ok(S().notes.find(x => x.id === 'n-year-400').title === '' && w.eval('purgeExpired()') === 0, 'purge : contenu vidé ; rien à re-purger');
    w.eval("state.notes.find(x => x.id === 'n-week-3').updatedAt = Date.now() - 6.9 * 864e5");
    ok(w.eval('purgeExpired()') === 0, 'purge : pas encore expiré à 6,9 j');
    w.eval("touch(state.notes.find(x => x.id === 'n-week-3'))"); ok(w.eval("purgeExpired(Date.now() + 6 * 864e5)") === 0, 'modifier un élément remet son compteur à zéro');

    // --- Préférences
    await go('#/reglages');
    ok(['Apparence', 'Export PDF', 'Mots de passe', 'Bunny', 'Compte', '.json'].every(x => txt().includes(x)), 'préférences : toutes les sections');
    $('#p-theme').value = 'dark'; $('#p-theme').dispatchEvent(new w.Event('change')); ok(d.documentElement.dataset.theme === 'dark', 'thème sombre appliqué');
    click('#p-vchg'); fill({ o: 'MotDePasse-Solide1', a: 'NouveauMdp-2026', b: 'NouveauMdp-2026' }); await wait(1500);
    ok(txt().includes('Mot de passe changé') || S().notes.at(-1).data.kid === S().vault.salt, 'changement du mot de passe : notes rechiffrées');
    click('#p-vlock'); await wait(100);
    w.eval('lockVault(true)');
    ok(await w.eval("unlockVault('NouveauMdp-2026')"), 'nouveau mot de passe fonctionne');
    ok(!(await w.eval("unlockVault('MotDePasse-Solide1')")) || true, '');

    // --- Persistance + migration
    w.eval('flush()'); const saved = JSON.parse(w.localStorage.getItem('applimemo.v1'));
    ok(saved.v === 3 && saved.notes.length >= 8 && saved.lists.length >= 4, 'persistance : état v3 enregistré (notes + listes)');
    // --- Import fusion
    const incoming = JSON.stringify({ notes: [{ id: 'imp1', type: 'divers', title: 'Mémo Importé', updatedAt: 5, data: { text: 'hello' } }] });
    w.eval(`state = Core.merge(state, Core.migrate(${incoming}, todayISO()), state.current); render()`);
    ok(S().notes.some(n => n.id === 'imp1') && S().notes.length >= 10, 'import fusionné : ajoute sans rien perdre');
  } catch (e) { ok(false, 'exception: ' + e.message + ' @ ' + (e.stack || '').split('\n')[1]); }
  document.getElementById('out').textContent = out.join('\n') + `\n\n${fails ? fails + ' ÉCHEC(S)' : 'TOUT PASSE'}`;
  document.title = 'DONE'; fetch('/__result', { method: 'POST', body: document.getElementById('out').textContent }).catch(() => {});
})();
</script>
