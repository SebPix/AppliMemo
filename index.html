<!DOCTYPE html>
<html lang="fr" data-theme="auto">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AppliMémo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#c4a33f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AppliMémo">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="topbar">
    <div class="top-row">
      <button id="top-back" class="top-back" type="button" aria-label="Page précédente" hidden>
        <span id="top-arrow" class="top-arrow" aria-hidden="true" hidden><svg viewBox="0 0 16 16">
            <path d="M7 1 L1 8 L7 15 Z" />
            <path d="M14.5 1 L8.5 8 L14.5 15 Z" />
          </svg></span>
        <span id="top-ico" class="top-ico" aria-hidden="true" hidden></span>
      </button>
      <h1 id="view-title" role="button" tabindex="0" aria-label="Replier ou déplier l’en-tête">MA
        JOURNÉE</h1>
      <span id="save-state" class="save-state" aria-live="polite"></span>
      <button id="btn-home" class="icon-btn home" aria-label="Accueil" title="Accueil"><svg viewBox="0 0 22 22"
          aria-hidden="true">
          <rect x="1.5" y="2" width="19" height="2.8" rx="1.4" />
          <rect x="1.5" y="7.4" width="19" height="2.8" rx="1.4" />
          <rect x="1.5" y="12.8" width="19" height="2.8" rx="1.4" />
          <rect x="1.5" y="18.2" width="19" height="2.8" rx="1.4" />
        </svg></button>
    </div>
    <div id="top-sub" class="top-sub" hidden></div>
    <div class="top-row2">
      <div id="top-actions" class="top-actions" hidden></div>
    </div>
    <div id="fmt-strip" class="fmt-strip" hidden>
      <div id="fmt-bar" class="fmt-bar" role="toolbar" aria-label="Mise en forme du texte"></div>
      <button id="fmt-toggle" class="fmt-toggle" type="button" aria-label="Rétracter la mise en forme du texte"
        aria-expanded="true">▴</button>
    </div>
    <div id="filter-rows" class="filter-rows" hidden></div>
    <div id="day-strip" class="day-strip" hidden></div>
    <div id="fmt-pop" class="fmt-pop" hidden></div>
    <div id="bar-pop" class="bar-pop" hidden>
      <div class="bar-pop-card" role="dialog" aria-label="Boutons de la page">
        <div class="bp-title"></div>
        <div class="bp-grid"></div>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <nav class="tabbar" id="tabbar">
    <button id="tab-add" class="tab-plus" aria-label="Créer"><span>＋</span>Créer</button>
    <button data-view="journee"><span>📅</span>Journées</button>
    <button data-view="afaire"><span>👁️</span>À faire</button>
    <button data-view="checklists"><span>☑️</span>Check-listes</button>
    <button data-view="memos"><span>📝</span>Mémos</button>
    <button data-view="biblio"><span>📚</span>Bibliothèque</button>
  </nav>

  <div id="print-root"></div>

  <div id="pop" class="pop-back" hidden></div>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <input type="file" id="file-import" accept="application/json,.json" hidden>

  <script src="core.js"></script>
  <script src="vault.js"></script>
  <script src="app.js"></script>
  <script src="rich.js"></script>
  <script src="journee.js"></script>
  <script src="lists.js"></script>
  <script src="notes.js"></script>
  <script src="voice.js"></script>
  <script src="quickadd.js"></script>
  <script src="library.js"></script>
  <script src="gcal.js"></script>
  <script src="settings.js"></script>
  <script src="swipe.js"></script>
  <script src="amelio.js"></script>
  <script src="main.js"></script>
</body>

</html>
